name: Exact replay

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-replay.txt

      - name: Install replay dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-replay.txt

      - name: Verify committed artifacts
        run: ./scripts/check_artifacts.sh

      - name: Reconstruct and replay both exact certificates
        env:
          REPLAY_JOBS: "4"
        run: ./scripts/run_full_replay.sh
